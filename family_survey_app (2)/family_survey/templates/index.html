{% extends "base.html" %}
{% block title %}परिवार दर्पण सर्वे फॉर्म{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mb-4">
  {% include "_letterhead.html" %}
  <div class="card-body">

    <form id="surveyForm" action="{{ url_for('submit') }}" method="POST" novalidate>

      <!-- Note + Village/Survey row, as on the printed form -->
      <div class="row g-3 align-items-end mb-3 note-row">
        <div class="col-12 col-md-5">
          <span class="fw-bold">नोट :-</span> कृपया जन्म व विवाह दिनांक सही सही देवें
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label mb-0">गाँव / शहर</label>
          <input type="text" class="form-control" name="village" placeholder="गाँव/शहर">
        </div>
        <div class="col-6 col-md-4">
          <label class="form-label mb-0">सर्वेक्षण का नाम</label>
          <input type="text" class="form-control" name="survey_name" placeholder="सर्वेक्षण का नाम">
        </div>
      </div>

      <!-- Family Level Info: परिवार क्रमांक और गौत्र, exactly as first two columns in the PDF table -->
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label">परिवार क्रमांक (Family No.)</label>
          <input type="text" class="form-control" name="family_no" placeholder="जैसे: 1">
        </div>
        <div class="col-md-6">
          <label class="form-label">गौत्र (Gotra)</label>
          <input type="text" class="form-control" name="gotra" placeholder="जैसे: भारद्वाज">
        </div>
      </div>

      <hr>

      <div id="membersContainer"></div>

      <div class="d-flex flex-wrap gap-2 mt-3">
        <button type="button" id="addMemberBtn" class="btn btn-outline-primary">
          <i class="bi bi-plus-circle"></i> सदस्य जोड़ें (Add Family Member)
        </button>
        <button type="submit" class="btn btn-brand ms-auto">
          <i class="bi bi-check2-circle"></i> सबमिट करें (Submit)
        </button>
      </div>

    </form>
  </div>
</div>

<!-- Hidden template for one member block, cloned by JS -->
<template id="memberTemplate">
  <div class="member-card card mb-3 border-secondary-subtle">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0 text-brand fw-bold member-title">सदस्य क्रमांक <span class="memberIndex">1</span></h6>
        <button type="button" class="btn btn-sm btn-outline-danger removeMemberBtn">
          <i class="bi bi-trash"></i> हटाएं
        </button>
      </div>
      <div class="row g-3">
        <div class="col-md-2">
          <label class="form-label">सदस्य क्रमांक</label>
          <input type="text" class="form-control" name="member_no[]">
        </div>
        <div class="col-md-4">
          <label class="form-label">सदस्य का नाम <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="member_name[]" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">पिता का नाम</label>
          <input type="text" class="form-control" name="father_name[]">
        </div>
        <div class="col-md-3">
          <label class="form-label">मुखिया से सम्बन्ध</label>
          <input type="text" class="form-control" name="relation[]" placeholder="जैसे: स्वयं, पुत्र, पत्नी">
        </div>

        <div class="col-md-3">
          <label class="form-label">जन्म तिथि / उम्र</label>
          <input type="text" class="form-control dob-field" name="dob_or_age[]" placeholder="YYYY-MM-DD या उम्र">
          <div class="invalid-feedback">अमान्य तिथि/उम्र (Invalid date/age)</div>
        </div>
        <div class="col-md-3">
          <label class="form-label">शैक्षणिक योग्यता</label>
          <input type="text" class="form-control" name="education[]">
        </div>
        <div class="col-md-3">
          <label class="form-label">वैवाहिक स्थिति</label>
          <select class="form-select" name="marital_status[]">
            <option value="">चुनें</option>
            <option>अविवाहित</option>
            <option>विवाहित</option>
            <option>विधवा/विधुर</option>
            <option>तलाकशुदा</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">चल दूरभाष (Mobile)</label>
          <input type="text" class="form-control mobile-field" name="mobile[]" maxlength="10" placeholder="10 अंक">
          <div class="invalid-feedback">अमान्य मोबाइल नंबर (Must be 10 digits, start 6-9)</div>
        </div>

        <div class="col-md-3">
          <label class="form-label">व्यवसाय</label>
          <input type="text" class="form-control" name="occupation[]">
        </div>
        <div class="col-md-3">
          <label class="form-label">आधार संख्या</label>
          <input type="text" class="form-control aadhaar-field" name="aadhaar[]" maxlength="12" placeholder="12 अंक">
          <div class="invalid-feedback">अमान्य आधार संख्या (Must be 12 digits)</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">वर्तमान मुख्यावास पता</label>
          <input type="text" class="form-control" name="current_address[]">
        </div>

        <div class="col-md-3">
          <label class="form-label">विवाह तिथि</label>
          <input type="date" class="form-control" name="marriage_date[]">
        </div>
        <div class="col-md-3">
          <label class="form-label">परिवार की वार्षिक आय</label>
          <input type="text" class="form-control" name="annual_income[]" placeholder="₹">
        </div>
        <div class="col-md-3">
          <label class="form-label">रक्त समूह</label>
          <select class="form-select" name="blood_group[]">
            <option value="">चुनें</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option>
            <option>O+</option><option>O-</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</template>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% endblock %}
